<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- One typeface, named once. Anything asking for monospace gets it, and the
     Nerd glyphs are already patched into it, so no fallback is needed for the
     icons a bar draws. Symbols Nerd Font Mono stays behind it for anything
     that ends up in a font we did not choose. -->
<fontconfig>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>IosevkaTerm Nerd Font Mono</family>
			<family>Symbols Nerd Font Mono</family>
			<family>DejaVu Sans Mono</family>
		</prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>IosevkaTerm Nerd Font Mono</family>
			<family>DejaVu Sans</family>
		</prefer>
	</alias>
	<alias>
		<family>serif</family>
		<prefer>
			<family>IosevkaTerm Nerd Font Mono</family>
			<family>DejaVu Serif</family>
		</prefer>
	</alias>
</fontconfig>
