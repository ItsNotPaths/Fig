# The face is foot's. The size is the shell's: size.ini is written from
# ~/.config/tildesh-shell/shell.lua, so one number moves the bar, the popups
# and this together. An include that is not there yet is not an error.
font=IosevkaTerm Nerd Font Mono:size=16px
include=~/.config/foot/size.ini
include=~/.local/state/tildesh/theme/foot.ini
pad=8x8

[cursor]
style=beam
