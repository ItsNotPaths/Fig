# No font line here on purpose. size.ini is written from
# ~/.config/tildesh-shell/config.lua and carries the face and the size, so
# nothing below it can win an argument about which applies.
[main]
include=~/.config/foot/size.ini
include=~/.local/state/tildesh/theme/foot.ini
pad=8x8

[cursor]
style=beam
