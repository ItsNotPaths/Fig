# Which backend answers which portal, for XDG_CURRENT_DESKTOP=hedl:wlroots.
#
# `default=*` is what this image did before the file chooser existed: no
# portals.conf at all, so xdg-desktop-portal took any backend whose UseIn
# matched. Writing it out changes nothing, and it keeps screencast and
# screenshot on xdg-desktop-portal-wlr without this file having to name it.
#
# The one line that IS a choice is the chooser. fig.portal names kippsrv, and
# the file dialog it opens is slopd.
[preferred]
default=*
org.freedesktop.impl.portal.FileChooser=fig
